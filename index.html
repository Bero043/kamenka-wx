<!DOCTYPE html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Санкт-Петербург — индикаторы</title>
<meta name="description" content="Погода, разводка мостов, часы работы музеев, магазинов и пекарен">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟩</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=Space+Mono&display=swap">
<style>
  :root { color-scheme: light; font-family: "Space Grotesk", sans-serif;
          --open: #16a34a; --soon: #eab308; --shut: #dc2626; --idle: #d4d4d4 }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body { background: #fff; color: #111; padding: clamp(1.2rem, 4vw, 3rem); display: grid; justify-content: center }
  main { width: min(100%, 52rem); display: grid; gap: 2rem }

  .glabel { font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: .18em;
            text-transform: uppercase; color: #8a8a8a; margin-bottom: .7rem }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: .5rem }

  .tile { aspect-ratio: 1; border-radius: 3px; padding: .55rem; display: flex; flex-direction: column;
          justify-content: space-between; color: #fff; overflow: hidden }
  .tile b { font-weight: 600; font-size: .76rem; line-height: 1.12; overflow-wrap: anywhere; hyphens: auto }
  .tile span { font-family: "Space Mono", monospace; font-size: 10.5px; opacity: .9 }
  .open { background: var(--open) } .soon { background: var(--soon); color: #111 }
  .shut { background: var(--shut) } .idle { background: var(--idle); color: #444 }

  /* погодные плитки — прямоугольники на две колонки */
  .wx { grid-column: span 2; aspect-ratio: auto; min-height: 92px }
  .wx .val { font-family: "Space Mono", monospace; font-size: 1.05rem; display: flex; align-items: center; gap: .4rem }
  .wx svg { width: 1.1em; height: 1.1em; animation: pulse 2.4s ease-in-out infinite }
  @keyframes pulse { 0%, to { opacity: 1 } 50% { opacity: .45 } }

  @media (max-width: 560px) {
    .tiles { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)) }
    .tile { aspect-ratio: auto; min-height: 78px }
    .wx { grid-column: 1 / -1; min-height: 76px }
  }

  .foot { display: grid; gap: .8rem; font-size: .9rem }
  .brent { display: flex; align-items: center; gap: .45rem; font-family: "Space Mono", monospace; font-size: .85rem }
  .brent svg { width: 1.1em; height: 1.1em }
  .news { color: inherit; text-decoration: none; border-bottom: 1px solid #ddd; padding-bottom: .15em; justify-self: start; line-height: 1.35 }
  .news:hover { border-color: #111 }
</style>

<main>
  <section><div class="glabel">Погода</div><div class="tiles" id="wx"></div></section>
  <section><div class="glabel">Музеи</div><div class="tiles" id="museums"></div></section>
  <section><div class="glabel">Мосты</div><div class="tiles" id="bridges"></div></section>
  <section><div class="glabel">Магазины</div><div class="tiles" id="shops"></div></section>
  <section><div class="glabel">Пекарни</div><div class="tiles" id="bakeries"></div></section>
  <div class="foot">
    <div class="brent">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c3.6 4.6 6.2 8 6.2 11.1a6.2 6.2 0 0 1-12.4 0C5.8 10.2 8.4 6.8 12 2.2z"/></svg>
      <span id="brent">—</span>
    </div>
    <a class="news" id="news" target="_blank" rel="noopener">—</a>
  </div>
</main>

<script>
/* ───────── РАСПИСАНИЯ. Правь здесь ─────────
   Массив из 7 строк, начиная с ПОНЕДЕЛЬНИКА. null — закрыто весь день. */

const week = (h, closed = []) => [0, 1, 2, 3, 4, 5, 6].map(i => closed.includes(i) ? null : h);

const MUSEUMS = [
  // пн, вт, ср, чт, пт, сб, вс
  ["Эрмитаж",      [null, "11:00-18:00", "11:00-18:00", "11:00-18:00", "11:00-18:00", "11:00-19:00", "11:00-18:00"]],
  ["Русский музей", ["10:00-19:00", null, "10:00-19:00", "10:00-19:00", "10:00-20:00", "10:00-20:00", "10:00-19:00"]],
  ["Бенуа",        ["10:00-19:00", null, "10:00-19:00", "10:00-19:00", "10:00-20:00", "10:00-20:00", "10:00-19:00"]],
  ["Эрарта",       week("11:00-23:00", [1])]
];

const SHOPS = [
  ["Пятёрочка",  week("08:00-23:00")],
  ["Перекрёсток", week("08:00-23:00")]
];

const BAKERIES = [
  ["Цех",      week("08:00-22:00")],
  ["Все дома", week("08:00-22:00")],
  ["Хлебник",  week("08:00-21:00")]
];

// Разводка: интервалы, когда проехать НЕЛЬЗЯ. Навигация 10 апреля — 30 ноября.
const NAVIGATION = ["04-10", "11-30"];
const BRIDGES = [
  ["Дворцовый",     ["01:10-02:50", "03:10-04:55"]],
  ["Троицкий",      ["01:20-04:50"]],
  ["Литейный",      ["01:40-04:45"]],
  ["Благовещенский", ["01:25-02:45", "03:10-05:00"]],
  ["Биржевой",      ["02:00-02:55", "03:35-04:55"]],
  ["Тучков",        ["02:00-02:55", "03:35-04:55"]],
  ["Большеохтинский", ["02:00-05:00"]],
  ["А. Невского",   ["02:20-05:10"]],
  ["Володарский",   ["02:00-03:45", "04:15-05:30"]],
  ["Сампсониевский", ["01:30-04:30"]],   // по заявке за 2 суток
  ["Гренадерский",  ["01:30-04:30"]],    // по заявке
  ["Кантемировский", ["01:30-04:30"]]    // по заявке
];

/* ───────── Логика ───────── */

const mins = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m };

const nowMsk = () => {
  const d = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Moscow" }));
  return { dow: (d.getDay() + 6) % 7, min: d.getHours() * 60 + d.getMinutes(), md: `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` };
};

// Открыто / закроется в течение часа / закрыто
const placeState = (hours, t) => {
  const today = hours[t.dow];
  if (!today) return ["shut", "закрыто"];
  const [o, c] = today.split("-").map(mins);
  if (t.min < o) return ["shut", `с ${today.slice(0, 5)}`];
  if (t.min >= c) return ["shut", "закрыто"];
  if (c - t.min <= 60) return ["soon", `до ${today.slice(6)}`];
  return ["open", `до ${today.slice(6)}`];
};

// Мост: зелёный — проехать можно, красный — разводят, жёлтый — развод в течение часа
const bridgeState = (spans, t) => {
  const [from, to] = NAVIGATION;
  if (t.md < from || t.md > to) return ["open", "вне навигации"];
  for (const s of spans) {
    const [a, b] = s.split("-").map(mins);
    if (t.min >= a && t.min < b) return ["shut", `до ${s.slice(6)}`];
    if (a - t.min > 0 && a - t.min <= 60) return ["soon", `в ${s.slice(0, 5)}`];
  }
  return ["open", `в ${spans[0].slice(0, 5)}`];
};

const tile = (name, [cls, note]) => `<div class="tile ${cls}"><b>${name}</b><span>${note}</span></div>`;

const paint = () => {
  const t = nowMsk();
  museums.innerHTML = MUSEUMS.map(([n, h]) => tile(n, placeState(h, t))).join("");
  shops.innerHTML = SHOPS.map(([n, h]) => tile(n, placeState(h, t))).join("");
  bakeries.innerHTML = BAKERIES.map(([n, h]) => tile(n, placeState(h, t))).join("");
  bridges.innerHTML = BRIDGES.map(([n, s]) => tile(n, bridgeState(s, t))).join("");
};

/* ───────── Погода ───────── */

const PLACES = [["Каменка", 60.045, 30.243], ["Петроградка", 59.96, 30.31]];

const arrow = dir => `<svg viewBox="0 0 24 24" style="transform:rotate(${dir + 180}deg)" aria-hidden="true">
  <path d="M12 21V5M12 5l-5.4 5.4M12 5l5.4 5.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;

const weather = data => wx.innerHTML = PLACES.map(([name], i) => {
  const c = data?.[i]?.current;
  if (!c) return `<div class="tile wx idle"><b>${name}</b><span>нет данных</span></div>`;
  // красный, если холодно (ниже +5), ветрено (7 м/с и больше) или дождь
  const bad = c.temperature_2m < 5 || c.wind_speed_10m >= 7 || c.weather_code >= 51;
  const sign = c.temperature_2m > 0 ? "+" : "";
  return `<div class="tile wx ${bad ? "shut" : "open"}">
    <b>${name}</b>
    <div class="val">${sign}${c.temperature_2m.toFixed(1)}°  ${arrow(c.wind_direction_10m)} ${Math.round(c.wind_speed_10m)} м/с</div>
  </div>`;
}).join("");

const loadWeather = () => fetch("https://api.open-meteo.com/v1/forecast?latitude=60.045,59.96&longitude=30.243,30.31" +
  "&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&wind_speed_unit=ms")
  .then(r => r.json()).then(weather).catch(() => weather(null));

/* ───────── Brent и новость ───────── */

const brent = async () => {
  const ser = await (await fetch("https://iss.moex.com/iss/statistics/engines/futures/markets/forts/series.json?asset_code=BR&iss.meta=off")).json();
  const cols = ser.series.columns, today = new Date().toISOString().slice(0, 10);
  const live = ser.series.data.map(r => Object.fromEntries(r.map((v, i) => [cols[i], v])))
    .filter(r => r.is_traded && r.expiration_date >= today)
    .sort((a, b) => a.expiration_date < b.expiration_date ? -1 : 1)[0];
  const q = await (await fetch(`https://iss.moex.com/iss/engines/futures/markets/forts/securities/${live.secid}.json?iss.meta=off&iss.only=marketdata&marketdata.columns=LAST,SETTLEPRICE`)).json();
  const [last, settle] = q.marketdata.data[0] ?? [];
  document.getElementById("brent").textContent = `$${(last || settle).toFixed(2)}`;
};

const topNews = async () => {
  const from = new Date(Date.now() - 36e5 * 30).toISOString().slice(0, 10);
  const r = await (await fetch("https://content.guardianapis.com/search?section=us-news&order-by=newest" +
    `&from-date=${from}&page-size=20&api-key=test`)).json();
  const cut = Date.now() - 864e5;
  const top = r.response.results.find(a => +new Date(a.webPublicationDate) >= cut) ?? r.response.results[0];
  const el = document.getElementById("news");
  el.textContent = top.webTitle;
  el.href = top.webUrl;
};

paint();
loadWeather();
brent().catch(() => {});
topNews().catch(() => {});
setInterval(paint, 60000);
setInterval(loadWeather, 300000);
setInterval(() => { brent().catch(() => {}); topNews().catch(() => {}) }, 900000);
</script>
