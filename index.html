<!DOCTYPE html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Санкт-Петербург — индикаторы</title>
<meta name="description" content="Погода, разводка мостов, часы работы музеев и магазинов, Brent и золото">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟩</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root { color-scheme: light; font-family: Manrope, "Helvetica Neue", sans-serif;
          --open: #35d07f; --soon: #f5c542; --shut: #ff5c5c; --idle: #9ca3af; --flat: #cbd5e1 }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body { min-height: 100svh; background: #0b0e13 center/cover fixed no-repeat; color: #fff; padding: clamp(.4rem, 1.2vw, 1rem);
         display: grid; grid-template-rows: 1fr auto; grid-template-columns: minmax(0, 1fr); gap: .4rem }

  /* затемнение поверх снимка */
  body::before { content: ""; position: fixed; inset: 0; background: rgba(4, 6, 12, .5); z-index: -1 }

  .grid { min-height: 0; display: grid; gap: .4rem; grid-auto-flow: dense; align-content: center;
          grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr)) }

  .tile { aspect-ratio: 1; border-radius: 50%; cursor: pointer; user-select: none; transition: filter .15s;
          padding: 13%; color: #fff; container-type: inline-size; overflow: hidden;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25em; text-align: center;
          background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .26), rgba(255, 255, 255, .09) 55%, rgba(255, 255, 255, .04));
          border: 1px solid rgba(255, 255, 255, .22); backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
          box-shadow: inset 0 -14px 26px rgba(0, 0, 0, .18); text-shadow: 0 1px 3px rgba(0, 0, 0, .45) }
  /* круги внутри раскрытой группы — мельче обычных */
  .tile[data-member] { width: 74%; place-self: center }
  /* две буквы — набираем крупно; cqw считается от content-box круга, отсюда большой процент */
  .tile[data-member] b { font-size: clamp(1rem, 40cqw, 2.4rem); letter-spacing: 0 }
  /* растянутая карточка — не круг, а пилюля; квадратная снова круг */
  .w2:not(.h2) { aspect-ratio: auto; border-radius: 999px }
  .w2.h2 { aspect-ratio: 1; border-radius: 50% }
  .bot { display: flex; align-items: center; justify-content: center; gap: .35rem; max-width: 100% }
  .bot > div { min-width: 0 }
  .tile:active { filter: brightness(1.07) }
  .tile b { width: 100%; min-width: 0; font-weight: 600; font-size: clamp(.78rem, 13cqw, 1.7rem); line-height: 1.05; letter-spacing: -.01em; hyphens: auto; overflow-wrap: break-word }
  .tile span { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: clamp(8px, 5cqw, 11px); opacity: .9 }
  .ico { flex: none; width: clamp(14px, 10cqw, 26px); height: auto; opacity: .85 }

  /* статус — маленькая точка рядом с подписью */
  .dot { flex: none; width: clamp(5px, 7cqw, 9px); aspect-ratio: 1; border-radius: 50%; background: var(--flat);
         box-shadow: 0 0 6px currentColor }
  .open .dot { background: var(--open) } .soon .dot { background: var(--soon) }
  .shut .dot { background: var(--shut) } .idle .dot { background: var(--idle) } .flat .dot { background: var(--flat) }

  .w2 { grid-column: span 2 }
  .h2 { grid-row: span 2 }
  .w2 b { width: 100%; font-size: clamp(.8rem, 7cqw, 1.7rem) }
  .w2 .ico { width: clamp(19px, 7cqw, 38px) }
  .val { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: clamp(.72rem, 1vw, 1.05rem); display: flex; align-items: center; gap: .28rem; white-space: nowrap }
  .val .arr { width: 1em; height: 1em; animation: pulse 2.4s ease-in-out infinite }
  @keyframes pulse { 0%, to { opacity: 1 } 50% { opacity: .45 } }


  /* в мелком круге значения и подписи компактнее — иначе трёхстрочные карточки не влезают */
  @container (max-width: 82px) {
    .val { font-size: clamp(.58rem, 8cqw, .82rem); line-height: 1.08 }
    .tile span { font-size: clamp(7.5px, 4.5cqw, 10px) }
  }

  /* три последних городских новости — полосой под сеткой */
  .newsbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: .25rem; padding: .5rem .6rem; border-radius: 3px; background: rgba(8, 10, 16, .72);
             backdrop-filter: blur(10px); font-size: clamp(.68rem, .85vw, .82rem) }
  .newsbar a { display: flex; align-items: baseline; gap: .5rem; color: #fff; text-decoration: none }
  .newsbar a:hover b { text-decoration: underline }
  .newsbar time { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: clamp(8.5px, .7vw, 10.5px); color: rgba(255,255,255,.55); flex: none }
  .newsbar b { min-width: 0; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

  @media (max-width: 620px) {
    .grid { gap: .28rem }
    /* на телефоне текст компактнее */
    .tile b { font-size: clamp(.62rem, 12cqw, 1.05rem) }
    .w2 b { font-size: clamp(.62rem, 6cqw, 1.05rem) }
    .val { font-size: clamp(.68rem, 9cqw, .92rem); line-height: 1.15 }
    .tile span { font-size: clamp(8.5px, 5.5cqw, 11px) }
    .tile { padding: .28rem .34rem; gap: .1rem }
  }
</style>

<div class="grid" id="grid"></div>
<div class="newsbar" id="newsbar"></div>

<script>
/* ───────── SCHEDULES. Edit here — seven entries from MONDAY, null = closed ───────── */

const week = (h, closed = []) => [0, 1, 2, 3, 4, 5, 6].map(i => closed.includes(i) ? null : h);

const MUSEUMS = [
  ["Эрмитаж",         [null, "11:00-18:00", "11:00-18:00", "11:00-18:00", "11:00-18:00", "11:00-19:00", "11:00-18:00"]],
  ["Русский музей",   ["10:00-19:00", null, "10:00-19:00", "10:00-19:00", "10:00-20:00", "10:00-20:00", "10:00-19:00"]],
  ["Корпус Бенуа",    ["10:00-19:00", null, "10:00-19:00", "10:00-19:00", "10:00-20:00", "10:00-20:00", "10:00-19:00"]],
  ["Эрарта",          week("11:00-23:00", [1])]
];
const SHOPS    = [["Пятёрочка", week("08:00-23:00")], ["Перекрёсток", week("08:00-23:00")]];
// пункт выдачи Ozon, Aviakonstruktorov 54 — часы типовые, уточни по своему пункту
const PICKUP   = [["Ozon", week("10:00-21:00")]];
const BAKERIES = [["Цех", week("08:00-22:00")], ["Все Дома", week("08:00-22:00")], ["Хлебник", week("08:00-21:00")]];

const NAVIGATION = ["04-10", "11-30"];
const BRIDGES = [
  ["Благовещенский",  ["01:25-02:45", "03:10-05:00"]],
  ["Дворцовый",       ["01:10-02:50", "03:10-04:55"]],
  ["Троицкий",        ["01:20-04:50"]],
  ["Литейный",        ["01:40-04:45"]],
  ["Большеохтинский", ["02:00-05:00"]],
  ["Александра Невского", ["02:20-05:10"]],
  ["Володарский",     ["02:00-03:45", "04:15-05:30"]],
  ["Биржевой",        ["02:00-02:55", "03:35-04:55"]],
  ["Тучков",          ["02:00-02:55", "03:35-04:55"]],
  ["Сампсониевский",  ["01:30-04:30"]],   // on request, 2 days ahead
  ["Гренадерский",    ["01:30-04:30"]],
  ["Кантемировский",  ["01:30-04:30"]]
];

/* ───────── Icons ───────── */

const svg = d => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICO = {
  museum:  svg('<path d="M3 21l18 0"/> <path d="M3 10l18 0"/> <path d="M5 6l7 -3l7 3"/> <path d="M4 10l0 11"/> <path d="M20 10l0 11"/> <path d="M8 14l0 3"/> <path d="M12 14l0 3"/> <path d="M16 14l0 3"/>'),
  bridge:  svg('<path d="M6 5l0 14"/> <path d="M18 5l0 14"/> <path d="M2 15l20 0"/> <path d="M3 8a7.5 7.5 0 0 0 3 -2a6.5 6.5 0 0 0 12 0a7.5 7.5 0 0 0 3 2"/> <path d="M12 10l0 5"/>'),
  shop:    svg('<path d="M3 21l18 0"/> <path d="M3 7v1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1h-18l2 -4h14l2 4"/> <path d="M5 21l0 -10.15"/> <path d="M19 21l0 -10.15"/> <path d="M9 21v-4a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v4"/>'),
  bakery:  svg('<path d="M10.2 18H4.774a1.5 1.5 0 0 1-1.352-.97 11 11 0 0 1 .132-6.487"/> <path d="M18 10.2V4.774a1.5 1.5 0 0 0-.97-1.352 11 11 0 0 0-6.486.132"/> <path d="M18 5a4 3 0 0 1 4 3 2 2 0 0 1-2 2 10 10 0 0 0-5.139 1.42"/> <path d="M5 18a3 4 0 0 0 3 4 2 2 0 0 0 2-2 10 10 0 0 1 1.42-5.14"/> <path d="M8.709 2.554a10 10 0 0 0-6.155 6.155 1.5 1.5 0 0 0 .676 1.626l9.807 5.42a2 2 0 0 0 2.718-2.718l-5.42-9.807a1.5 1.5 0 0 0-1.626-.676"/>'),
  parcel:  svg('<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/> <path d="M12 22V12"/> <polyline points="3.29 7 12 12 20.71 7"/> <path d="m7.5 4.27 9 5.15"/>'),
  oil:     svg('<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>'),
  gold:    svg('<path d="M13.744 17.736a6 6 0 1 1-7.48-7.48"/> <path d="M15 6h1v4"/> <path d="m6.134 14.768.866-.5 2 3.464"/> <circle cx="16" cy="8" r="6"/>'),
  iss:     svg('<path d="M20.341 6.484A10 10 0 0 1 10.266 21.85"/> <path d="M3.659 17.516A10 10 0 0 1 13.74 2.152"/> <circle cx="12" cy="12" r="3"/> <circle cx="19" cy="5" r="2"/> <circle cx="5" cy="19" r="2"/>'),
  star:    svg('<path d="m10.065 12.493-6.18 1.318a.934.934 0 0 1-1.108-.702l-.537-2.15a1.07 1.07 0 0 1 .691-1.265l13.504-4.44"/> <path d="m13.56 11.747 4.332-.924"/> <path d="m16 21-3.105-6.21"/> <path d="M16.485 5.94a2 2 0 0 1 1.455-2.425l1.09-.272a1 1 0 0 1 1.212.727l1.515 6.06a1 1 0 0 1-.727 1.213l-1.09.272a2 2 0 0 1-2.425-1.455z"/> <path d="m6.158 8.633 1.114 4.456"/> <path d="m8 21 3.105-6.21"/> <circle cx="12" cy="13" r="2"/>'),
  news:    svg('<path d="M15 18h-5"/> <path d="M18 14h-8"/> <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/> <rect width="8" height="4" x="10" y="6" rx="1"/>'),
  sun:     svg('<circle cx="12" cy="12" r="4"/> <path d="M12 2v2"/> <path d="M12 20v2"/> <path d="m4.93 4.93 1.41 1.41"/> <path d="m17.66 17.66 1.41 1.41"/> <path d="M2 12h2"/> <path d="M20 12h2"/> <path d="m6.34 17.66-1.41 1.41"/> <path d="m19.07 4.93-1.41 1.41"/>'),
  cloud:   svg('<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>'),
  rain:    svg('<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/> <path d="M16 14v6"/> <path d="M8 14v6"/> <path d="M12 16v6"/>')
};

/* ───────── Размер карточки: 0 — базовый, 1 — две в ширину, 2 — квадрат 2×2 ───────── */

const SIZE = { "wx:Kamenka": 1, "wx:Petrogradka": 1, apod: 1 };   // стартовые
const spanOf = key => ["", "w2", "w2 h2"][SIZE[key] ?? 0];

// мосты и музеи свёрнуты в один круг; клик раскрывает всю группу
const OPEN_GROUP = { bridges: false, museums: false };

grid.addEventListener("click", e => {
  const card = e.target.closest(".tile");
  if (!card || e.target.closest("a")) return;                     // ссылку внутри не перехватываем
  const { group, member, key } = card.dataset;
  if (group) OPEN_GROUP[group] = true;                            // свёрнутый круг → раскрыть
  else if (member) OPEN_GROUP[member] = false;                    // клик по элементу → свернуть
  else SIZE[key] = ((SIZE[key] ?? 0) + 1) % 3;                    // обычная карточка → размер
  paint();
});

/* ───────── Logic ───────── */

const mins = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m };

const nowMsk = () => {
  const d = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Moscow" }));
  return { dow: (d.getDay() + 6) % 7, min: d.getHours() * 60 + d.getMinutes(),
           md: `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` };
};

const placeState = (hours, t) => {
  const today = hours[t.dow];
  if (!today) return ["shut", "закрыто"];
  const [o, c] = today.split("-").map(mins);
  if (t.min < o) return ["shut", `с ${today.slice(0, 5)}`];
  if (t.min >= c) return ["shut", "закрыто"];
  if (c - t.min <= 60) return ["soon", `до ${today.slice(6)}`];
  return ["open", `до ${today.slice(6)}`];
};

const bridgeState = (spans, t) => {
  const [from, to] = NAVIGATION;
  if (t.md < from || t.md > to) return ["open", "вне навигации"];
  for (const s of spans) {
    const [a, b] = s.split("-").map(mins);
    if (t.min >= a && t.min < b) return ["shut", `до ${s.slice(6)}`];
    if (a - t.min > 0 && a - t.min <= 60) return ["soon", `в ${s.slice(0, 5)}`];
  }
  return ["open", `в ${spans[0].slice(0, 5)}`];
};

// имена групп нужны, чтобы сокращения не совпадали: «Эрмитаж» и «Эрарта» оба дают «Эр»
const GROUP_NAMES = {
  museums: () => MUSEUMS.map(([n]) => n),
  bridges: () => BRIDGES.map(([n]) => n)
};

const shortLabel = (name, peers) => {
  for (let len = 2; len <= name.length; len++) {
    const cut = name.slice(0, len).toLowerCase();
    if (!peers.some(o => o !== name && o.slice(0, len).toLowerCase() === cut)) return name.slice(0, len);
  }
  return name.slice(0, 2);
};

const tile = (name, [cls, note], icon, key = name, member = "") =>
  `<div class="tile ${cls} ${spanOf(key)}" data-key="${key}"
     ${member ? `data-member="${member}" title="${name}"` : ""}>
    <b>${member ? shortLabel(name, GROUP_NAMES[member]()) : name}</b>
    <div class="bot"><i class="dot"></i><span>${note}</span>${icon}</div></div>`;

const groupTile = (label, [cls, note], icon, group) =>
  `<div class="tile ${cls} ${spanOf(group)}" data-group="${group}">
    <b>${label}</b><div class="bot"><i class="dot"></i><span>${note}</span>${icon}</div></div>`;

// сводка по группе: худший статус задаёт цвет
const worst = states => states.some(([c]) => c === "shut") ? "shut"
                     : states.some(([c]) => c === "soon") ? "soon" : "open";

/* ───────── Weather ───────── */

const PLACES = [["Каменка", 60.045, 30.243], ["Петроградка", 59.96, 30.31]];
let wxData = null;

const arrow = dir => `<svg class="arr" viewBox="0 0 24 24" style="transform:rotate(${dir + 180}deg)" aria-hidden="true">
  <path d="M12 21V5M12 5l-5.4 5.4M12 5l5.4 5.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;

const wxTile = (name, c) => {
  const key = `wx:${name}`;
  if (!c) return `<div class="tile idle ${spanOf(key)}" data-key="${key}"><b>${name}</b><div class="bot"><i class="dot"></i><span>нет данных</span>${ICO.cloud}</div></div>`;
  // красный, если холодно (ниже +5), ветрено (7 м/с и больше) или дождь
  const bad = c.temperature_2m < 5 || c.wind_speed_10m >= 7 || c.weather_code >= 51;
  const ico = c.weather_code >= 51 ? ICO.rain : c.weather_code >= 2 ? ICO.cloud : ICO.sun;
  const sign = c.temperature_2m > 0 ? "+" : "";
  return `<div class="tile ${bad ? "shut" : "open"} ${spanOf(key)}" data-key="${key}"><b>${name}</b>
    <div class="bot"><i class="dot"></i><div class="val">${sign}${c.temperature_2m.toFixed(1)}° ${arrow(c.wind_direction_10m)} ${Math.round(c.wind_speed_10m)} м/с</div>${ico}</div></div>`;
};

/* ───────── Commodities: Brent and gold from MOEX ───────── */

const MARKET = [["Brent", "BR", ICO.oil], ["Золото", "GOLD", ICO.gold]];
const quotes = {};   // asset -> {price, change}

const loadQuote = async asset => {
  const ser = await (await fetch(`https://iss.moex.com/iss/statistics/engines/futures/markets/forts/series.json?asset_code=${asset}&iss.meta=off`)).json();
  const cols = ser.series.columns, today = new Date().toISOString().slice(0, 10);
  const live = ser.series.data.map(r => Object.fromEntries(r.map((v, i) => [cols[i], v])))
    .filter(r => r.is_traded && r.expiration_date >= today)
    .sort((a, b) => a.expiration_date < b.expiration_date ? -1 : 1)[0];
  const q = await (await fetch(`https://iss.moex.com/iss/engines/futures/markets/forts/securities/${live.secid}.json` +
    "?iss.meta=off&iss.only=marketdata&marketdata.columns=LAST,SETTLEPRICE,LASTTOPREVPRICE")).json();
  const [last, settle, chg] = q.marketdata.data[0] ?? [];
  const month = quotes[asset]?.month;
  quotes[asset] = { price: last || settle, change: chg, month };

  // изменение за месяц считаем один раз за загрузку: дневные свечи того же контракта.
  // именно того же — истёкшая серия обрывается на дате экспирации, и сравнение врало бы
  if (month === undefined) {
    const from = new Date(Date.now() - 35 * 864e5).toISOString().slice(0, 10);
    const c = (await (await fetch(`https://iss.moex.com/iss/engines/futures/markets/forts/securities/${live.secid}` +
      `/candles.json?from=${from}&interval=24&iss.meta=off&candles.columns=close`)).json()).candles.data;
    if (c.length > 1) quotes[asset].month = (c.at(-1)[0] - c[0][0]) / c[0][0] * 100;
  }
};

const quoteTile = (name, asset, icon) => {
  const q = quotes[asset];
  if (!q?.price) return `<div class="tile idle ${spanOf(name)}" data-key="${name}"><b>${name}</b><div class="bot"><i class="dot"></i><span>нет данных</span>${icon}</div></div>`;
  // цвет и подпись — по месяцу; суточное изменение уходит в подсказку
  const m = q.month;
  const cls = m == null ? "flat" : m > 0 ? "open" : "shut";
  const pct = v => `${v > 0 ? "+" : ""}${v.toFixed(1)}%`;
  const hint = q.change == null ? "" : ` title="за сутки ${pct(q.change)}"`;
  return `<div class="tile ${cls} ${spanOf(name)}" data-key="${name}"${hint}><b>${name}</b>
    <div class="bot"><i class="dot"></i><div><div class="val">$${q.price.toFixed(2)}</div>
    <span>${m == null ? "—" : `мес ${pct(m)}`}</span></div>${icon}</div></div>`;
};

/* ───────── ISS in real time ───────── */

let iss = null;
const HOME = [60.045, 30.243];   // Каменка

const kmBetween = (a1, o1, a2, o2) => {
  const r = Math.PI / 180, R = 6371;
  const h = Math.sin((a2 - a1) * r / 2) ** 2 +
            Math.cos(a1 * r) * Math.cos(a2 * r) * Math.sin((o2 - o1) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};

const loadIss = () => fetch("https://api.wheretheiss.at/v1/satellites/25544")
  .then(r => r.json()).then(d => { iss = d });

const issTile = () => {
  if (!iss) return `<div class="tile idle ${spanOf("iss")}" data-key="iss"><b>МКС</b><div class="bot"><i class="dot"></i><span>нет данных</span>${ICO.iss}</div></div>`;
  const ns = `${Math.abs(iss.latitude).toFixed(1)}°${iss.latitude >= 0 ? "N" : "S"}`;
  const ew = `${Math.abs(iss.longitude).toFixed(1)}°${iss.longitude >= 0 ? "E" : "W"}`;
  const away = kmBetween(...HOME, iss.latitude, iss.longitude);
  const overhead = away <= iss.footprint / 2;      // footprint — диаметр зоны видимости
  const alt = Math.round(iss.altitude);
  return `<div class="tile ${overhead ? "open" : "flat"} ${spanOf("iss")}" data-key="iss"><b>МКС</b>
    <div class="bot"><i class="dot"></i><div><div class="val">${ns} ${ew}</div>
    <span>${overhead ? `над нами · ${alt} км` : `${alt} км`}</span></div>${ICO.iss}</div></div>`;
};

/* ───────── NASA astronomy picture of the day ───────── */

let apod = null;

// DEMO_KEY: всего 10 запросов в час на адрес, поэтому снимок кэшируется на сутки
const loadApod = async () => {
  const today = new Date().toISOString().slice(0, 10);
  try {
    const saved = JSON.parse(localStorage.getItem("apod") || "null");
    if (saved?.fetched === today) { apod = saved.data; return }
  } catch {}
  const d = await (await fetch("https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&thumbs=true")).json();
  if (!d?.title) throw new Error("apod unavailable");
  apod = d;
  try { localStorage.setItem("apod", JSON.stringify({ fetched: today, data: d })) } catch {}
};

const paintApod = () => {
  if (!apod) return;
  const pic = apod.media_type === "image" ? apod.url : apod.thumbnail_url;   // по средам бывает видео
  if (pic) document.body.style.backgroundImage = `url("${pic}")`;
};

/* ───────── Три последние городские новости: RSS «Фонтанки» ───────── */

let stories = [];
// рубрика «Город» локальна по определению; из остальных берём только с петербургским маркером
const LOCAL = /петербург|питер|спб|ленинград|ленобласт|нев(а|ы|е|ой)|кронштадт|петергоф|пушкинск|колпин|приморск|выборгск|курортн|кировск|московск(ий|ом) район/i;

const loadNews = async () => {
  // хост обязательно с www: fontanka.ru отдаёт 301 без CORS-заголовка, и браузер обрывает запрос
  const xml = await (await fetch("https://www.fontanka.ru/rss-feeds/rss.xml", { cache: "no-store" })).text();
  const doc = new DOMParser().parseFromString(xml, "text/xml");
  const text = (item, tag) => item.querySelector(tag)?.textContent?.trim() ?? "";
  stories = [...doc.querySelectorAll("item")]
    .map(i => ({ title: text(i, "title"), link: text(i, "link"), cat: text(i, "category"), date: new Date(text(i, "pubDate")) }))
    .filter(a => a.cat === "Город" || LOCAL.test(a.title))
    .sort((a, b) => b.date - a.date)
    .slice(0, 3);
};

const paintNews = () => {
  const news = stories.length
    ? stories.map(a => `<a href="${a.link}" target="_blank" rel="noopener">
        <time>${a.date.toLocaleTimeString("ru-RU", { timeZone: "Europe/Moscow", hour: "2-digit", minute: "2-digit" })}</time>
        <b>${a.title}</b></a>`).join("")
    : `<a><time>—</time><b>новости недоступны</b></a>`;
  const shot = apod
    ? `<a class="shot" href="https://apod.nasa.gov/apod/astropix.html" target="_blank" rel="noopener">
         <time>NASA</time><b>${apod.title}</b></a>`
    : "";
  newsbar.innerHTML = news + shot;
};

/* ───────── Render ───────── */

// круг = ширина колонки, поэтому число колонок подбираем под доступную высоту:
// идём от крупных кругов к мелким и останавливаемся на первом влезающем варианте
const fitGrid = () => {
  const gap = parseFloat(getComputedStyle(grid).gap) || 6;
  const bs = getComputedStyle(document.body);
  const W = grid.clientWidth;
  // высоту берём от вьюпорта, а не от сетки: при переполнении сетка растягивается
  // вместе со страницей и подбор решал бы, что всё влезает
  const H = innerHeight - parseFloat(bs.paddingTop) - parseFloat(bs.paddingBottom)
            - newsbar.offsetHeight - (parseFloat(bs.rowGap) || 0);
  if (!W || H <= 0) return;
  const cells = [...grid.children].reduce((n, el) =>
    n + (el.classList.contains("w2") ? 2 : 1) * (el.classList.contains("h2") ? 2 : 1), 0);
  let cols = 3;
  for (let c = 3; c <= 12; c++) {
    const d = (W - gap * (c - 1)) / c;
    if (d < 92) break;             // мельче текст уже не читается — лучше прокрутка
    cols = c;
    const rows = Math.ceil(cells / c);
    if (rows * d + gap * (rows - 1) <= H) break;
  }
  grid.style.setProperty("--cols", cols);
};

const paint = () => {
  const t = nowMsk();
  grid.innerHTML = [
    ...PLACES.map(([name], i) => wxTile(name, wxData?.[i]?.current)),
    ...(() => {
      const st = MUSEUMS.map(([, h]) => placeState(h, t));
      const open = st.filter(([c]) => c !== "shut").length;
      return OPEN_GROUP.museums
        ? MUSEUMS.map(([n, h]) => tile(n, placeState(h, t), ICO.museum, n, "museums"))
        : [groupTile("Музеи", [open ? worst(st.filter(([c]) => c !== "shut")) : "shut",
            `${open} из ${MUSEUMS.length} открыто`], ICO.museum, "museums")];
    })(),
    ...(() => {
      const st = BRIDGES.map(([, sp]) => bridgeState(sp, t));
      const raised = st.filter(([c]) => c === "shut").length;
      const soon = st.filter(([c]) => c === "soon").length;
      return OPEN_GROUP.bridges
        ? BRIDGES.map(([n, sp]) => tile(n, bridgeState(sp, t), ICO.bridge, n, "bridges"))
        : [groupTile("Мосты", [worst(st),
            raised ? `разведено: ${raised}` : soon ? `скоро: ${soon}` : "все свободны"], ICO.bridge, "bridges")];
    })(),
    ...SHOPS.map(([n, h]) => tile(n, placeState(h, t), ICO.shop)),
    ...PICKUP.map(([n, h]) => tile(n, placeState(h, t), ICO.parcel)),
    ...BAKERIES.map(([n, h]) => tile(n, placeState(h, t), ICO.bakery)),
    ...MARKET.map(([n, a, i]) => quoteTile(n, a, i)),
    issTile()
  ].join("");
  fitGrid();
};

addEventListener("resize", fitGrid);

const loadWeather = () => fetch("https://api.open-meteo.com/v1/forecast?latitude=60.045,59.96&longitude=30.243,30.31" +
  "&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&wind_speed_unit=ms")
  .then(r => r.json()).then(d => { wxData = d; paint() }).catch(() => paint());

paint();
paintNews();
loadWeather();
loadIss().then(paint).catch(() => {});
loadApod().then(() => { paintApod(); paintNews() }).catch(() => {});
Promise.all(MARKET.map(([, a]) => loadQuote(a).catch(() => {}))).then(paint);
loadNews().then(paintNews).catch(() => {});

setInterval(() => loadIss().then(paint).catch(paint), 60000);   // МКС проходит ~460 км в минуту
setInterval(loadWeather, 300000);
setInterval(() => {
  Promise.all(MARKET.map(([, a]) => loadQuote(a).catch(() => {}))).then(paint);
  loadNews().then(paintNews).catch(() => {});
}, 900000);
setInterval(() => loadApod().then(() => { paintApod(); paintNews() }).catch(() => {}), 6 * 36e5);
</script>
