<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kamenka · Petrogradka</title>
<meta name="description" content="Live temperature and wind in Kamenka and Petrogradka, Saint Petersburg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌡️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=Space+Mono&display=swap">
<style>
  :root { color-scheme: light; font-family: "Space Grotesk", sans-serif }
  body { margin: 0; min-height: 100svh; display: grid; place-content: center; padding: 2rem; background: #fff; color: #111; font-size: clamp(1.05rem, 1.5vw, 1.35rem) }
  .places { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4rem; max-width: 40rem }
  .head { display: flex; align-items: center; gap: .5rem; margin-bottom: 1em }
  .name { font-weight: 600 }
  .temp { font-family: "Space Mono", monospace; font-size: .8em; display: flex; align-items: center; gap: .35rem }
  .temp svg { width: 1.15em; height: 1.15em }
  .arrow { width: 1.25em; height: 1.25em; margin-top: .5em; animation: pulse 2.4s ease-in-out infinite }
  @keyframes pulse { 0%, to { opacity: 1 } 50% { opacity: .45 } }
  @media (max-width: 480px) { .places { grid-template-columns: 1fr; gap: 2.5rem } }
</style>

<div class="places" id="app"></div>

<script>
  const PLACES = [["Kamenka", 60.045, 30.243], ["Petrogradka", 59.96, 30.31]];

  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M19.4 4.6l-2.1 2.1M6.7 17.3l-2.1 2.1"/></svg>';
  const CLOUD = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 20A5.5 5.5 0 0 1 6 9a6.5 6.5 0 0 1 12.3 1.6A4.7 4.7 0 0 1 17.5 20z"/></svg>';
  const RAIN = CLOUD.replace("</svg>", '<path d="M8 21.5l-.8 2M12 21.5l-.8 2M16 21.5l-.8 2" stroke="currentColor" stroke-width="1.6"/></svg>');

  const icon = code => code >= 51 ? RAIN : code >= 2 ? CLOUD : SUN;

  // dir — откуда дует (0° = север). Стрелка показывает, куда: dir + 180.
  // Южная составляющая — тёплый ветер, северная — холодный.
  const arrow = dir => {
    const warm = Math.cos((dir - 180) * Math.PI / 180);
    const color = warm > 0.15 ? `hsl(${28 - 18 * warm} 88% 52%)`
                : warm < -0.15 ? `hsl(${212 + 8 * warm} 85% 54%)`
                : "#9a9a9a";
    return `<svg class="arrow" viewBox="0 0 24 24" role="img" aria-label="Wind from ${Math.round(dir)}°"
      style="transform:rotate(${dir + 180}deg);color:${color}">
      <path d="M12 21V5M12 5l-5.4 5.4M12 5l5.4 5.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  };

  const render = data => app.innerHTML = PLACES.map(([name], i) => {
    const c = data?.[i]?.current;
    if (!c) return `<div><div class="head"><span class="name">${name}</span></div><div>No data</div></div>`;
    return `<div>
      <div class="head"><span class="name">${name}</span>
        <span class="temp">${icon(c.weather_code)}${c.temperature_2m > 0 ? "+" : ""}${c.temperature_2m.toFixed(1)}°C</span></div>
      <div>Wind ${Math.round(c.wind_speed_10m)} m/s</div>
      ${arrow(c.wind_direction_10m)}
    </div>`;
  }).join("");

  const load = () => fetch("https://api.open-meteo.com/v1/forecast?latitude=60.045,59.96&longitude=30.243,30.31" +
    "&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&wind_speed_unit=ms")
    .then(r => r.json())
    .then(render)
    .catch(() => render(null));

  load();
  setInterval(load, 300000);
</script>
