<!DOCTYPE html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Каменка — температура</title>
<style>:root{color-scheme:light dark;font-family:system-ui,sans-serif}</style>

<h1 id="temp">—°</h1>
<p id="wind">Ветер —</p>

<script>
const load = () => fetch("https://api.open-meteo.com/v1/forecast?latitude=60.045&longitude=30.243&current=temperature_2m,wind_speed_10m&wind_speed_unit=ms")
  .then(r => r.json())
  .then(({ current: c }) => {
    const t = Math.round(c.temperature_2m * 10) / 10;
    temp.textContent = (t > 0 ? "+" : "") + String(t).replace(".", ",") + "°";
    wind.textContent = `Ветер ${Math.round(c.wind_speed_10m)} м/с`;
  })
  .catch(() => wind.textContent = "Нет данных");

load();
setInterval(load, 300000);
</script>
