<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saint Petersburg — indicators</title>
<meta name="description" content="Weather, bridge openings, museum and shop hours in Saint Petersburg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟩</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=Space+Mono&display=swap">
<style>
  :root { color-scheme: light; font-family: "Space Grotesk", sans-serif;
          --open: #16a34a; --soon: #eab308; --shut: #dc2626; --idle: #d4d4d4; --water: #dbeafe }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body { background: #fff; color: #111; padding: clamp(1.2rem, 4vw, 3rem); display: grid; justify-content: center }
  main { width: min(100%, 52rem); display: grid; gap: 2rem }

  .glabel { font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: .18em;
            text-transform: uppercase; color: #8a8a8a; margin-bottom: .7rem }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: .5rem }

  .tile { aspect-ratio: 1; border-radius: 3px; padding: .55rem; display: flex; flex-direction: column;
          justify-content: space-between; color: #fff; overflow: hidden }
  .tile b { font-weight: 600; font-size: .76rem; line-height: 1.12; overflow-wrap: anywhere }
  .tile span { font-family: "Space Mono", monospace; font-size: 10.5px; opacity: .9 }
  .open { background: var(--open) } .soon { background: var(--soon); color: #111 }
  .shut { background: var(--shut) } .idle { background: var(--idle); color: #444 }

  .wx { grid-column: span 2; aspect-ratio: auto; min-height: 92px }
  .wx .val { font-family: "Space Mono", monospace; font-size: 1.05rem; display: flex; align-items: center; gap: .4rem }
  .wx svg { width: 1.1em; height: 1.1em; animation: pulse 2.4s ease-in-out infinite }
  @keyframes pulse { 0%, to { opacity: 1 } 50% { opacity: .45 } }

  /* карта Невы */
  .map { width: 100%; height: auto; overflow: visible }
  .river { fill: none; stroke: var(--water); stroke-linecap: round }
  .pt { stroke: #fff; stroke-width: 2 }
  .pt.open { fill: var(--open) } .pt.soon { fill: var(--soon) } .pt.shut { fill: var(--shut) }
  .lbl { font-family: "Space Grotesk", sans-serif; font-size: 11.5px; font-weight: 600; fill: #111; text-anchor: middle }
  .lbl tspan { font-family: "Space Mono", monospace; font-size: 8.5px; font-weight: 400; fill: #666 }
  .note { font-family: "Space Mono", monospace; font-size: 8px; fill: #8a8a8a }

  .foot { display: grid; gap: .8rem; font-size: .9rem }
  .brent { display: flex; align-items: center; gap: .45rem; font-family: "Space Mono", monospace; font-size: .85rem }
  .brent svg { width: 1.1em; height: 1.1em }
  .news { color: inherit; text-decoration: none; border-bottom: 1px solid #ddd; padding-bottom: .15em; justify-self: start; line-height: 1.35 }
  .news:hover { border-color: #111 }

  @media (max-width: 560px) {
    .tiles { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)) }
    .tile { aspect-ratio: auto; min-height: 78px }
    .wx { grid-column: 1 / -1; min-height: 76px }
    .lbl { font-size: 15px } .lbl tspan { font-size: 11.5px } .note { font-size: 10px }
  }
</style>

<main>
  <section><div class="glabel">Weather</div><div class="tiles" id="wx"></div></section>
  <section><div class="glabel">Museums</div><div class="tiles" id="museums"></div></section>
  <section><div class="glabel">Bridges</div><div class="tiles" id="bridges"></div></section>
  <section><div class="glabel">Shops</div><div class="tiles" id="shops"></div></section>
  <section><div class="glabel">Bakeries</div><div class="tiles" id="bakeries"></div></section>
  <section><div class="glabel">Neva</div><svg class="map" id="map" viewBox="0 0 620 232"></svg></section>
  <div class="foot">
    <div class="brent">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c3.6 4.6 6.2 8 6.2 11.1a6.2 6.2 0 0 1-12.4 0C5.8 10.2 8.4 6.8 12 2.2z"/></svg>
      <span id="brent">—</span>
    </div>
    <a class="news" id="news" target="_blank" rel="noopener">—</a>
  </div>
</main>

<script>
/* ───────── SCHEDULES. Edit here ─────────
   Seven entries starting from MONDAY. null — closed all day. */

const week = (h, closed = []) => [0, 1, 2, 3, 4, 5, 6].map(i => closed.includes(i) ? null : h);

const MUSEUMS = [
  // mon, tue, wed, thu, fri, sat, sun
  ["Hermitage",      [null, "11:00-18:00", "11:00-18:00", "11:00-18:00", "11:00-18:00", "11:00-19:00", "11:00-18:00"]],
  ["Russian Museum", ["10:00-19:00", null, "10:00-19:00", "10:00-19:00", "10:00-20:00", "10:00-20:00", "10:00-19:00"]],
  ["Benois Wing",    ["10:00-19:00", null, "10:00-19:00", "10:00-19:00", "10:00-20:00", "10:00-20:00", "10:00-19:00"]],
  ["Erarta",         week("11:00-23:00", [1])]
];

const SHOPS = [
  ["Pyaterochka", week("08:00-23:00")],
  ["Perekrestok", week("08:00-23:00")]
];

const BAKERIES = [
  ["Tsekh",     week("08:00-22:00")],
  ["Vse Doma",  week("08:00-22:00")],
  ["Khlebnik",  week("08:00-21:00")]
];

/* Bridge openings — when you CANNOT cross. Navigation season: 10 Apr — 30 Nov.
   Third element: position on the map, side = where the label goes. */
const NAVIGATION = ["04-10", "11-30"];
const BRIDGES = [
  ["Blagoveshchensky", ["01:25-02:45", "03:10-05:00"], { river: 0, at: 0.04, side: "below", short: "Blagovesh." }],
  ["Palace",           ["01:10-02:50", "03:10-04:55"], { river: 0, at: 0.19, side: "below" }],
  ["Trinity",          ["01:20-04:50"],                { river: 0, at: 0.31, side: "below" }],
  ["Liteyny",          ["01:40-04:45"],                { river: 0, at: 0.42, side: "above" }],
  ["Bolsheokhtinsky",  ["02:00-05:00"],                { river: 0, at: 0.55, side: "above", short: "Bolsheokht." }],
  ["Al. Nevsky",       ["02:20-05:10"],                { river: 0, at: 0.68, side: "below" }],
  ["Volodarsky",       ["02:00-03:45", "04:15-05:30"], { river: 0, at: 0.91, side: "above" }],
  ["Birzhevoy",        ["02:00-02:55", "03:35-04:55"], { river: 1, at: 0.26, side: "above" }],
  ["Tuchkov",          ["02:00-02:55", "03:35-04:55"], { river: 1, at: 0.82, side: "above" }],
  ["Sampsonievsky",    ["01:30-04:30"], null],   // on request, 2 days ahead
  ["Grenadersky",      ["01:30-04:30"], null],
  ["Kantemirovsky",    ["01:30-04:30"], null]
];

/* ───────── Logic ───────── */

const mins = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m };

const nowMsk = () => {
  const d = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Moscow" }));
  return { dow: (d.getDay() + 6) % 7, min: d.getHours() * 60 + d.getMinutes(),
           md: `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` };
};

const placeState = (hours, t) => {
  const today = hours[t.dow];
  if (!today) return ["shut", "closed"];
  const [o, c] = today.split("-").map(mins);
  if (t.min < o) return ["shut", `from ${today.slice(0, 5)}`];
  if (t.min >= c) return ["shut", "closed"];
  if (c - t.min <= 60) return ["soon", `till ${today.slice(6)}`];
  return ["open", `till ${today.slice(6)}`];
};

const bridgeState = (spans, t) => {
  const [from, to] = NAVIGATION;
  if (t.md < from || t.md > to) return ["open", "off-season"];
  for (const s of spans) {
    const [a, b] = s.split("-").map(mins);
    if (t.min >= a && t.min < b) return ["shut", `till ${s.slice(6)}`];
    if (a - t.min > 0 && a - t.min <= 60) return ["soon", `at ${s.slice(0, 5)}`];
  }
  return ["open", `at ${spans[0].slice(0, 5)}`];
};

const tile = (name, [cls, note]) => `<div class="tile ${cls}"><b>${name}</b><span>${note}</span></div>`;

/* ───────── Neva map ───────── */

const RIVERS = [
  ["M 12,138 C 88,135 148,122 198,101 C 248,80 302,82 360,90 C 410,97 446,130 480,161 C 514,191 556,204 612,212", 11],
  ["M 194,104 C 166,86 130,66 60,48", 8]
];

const drawMap = t => {
  const water = RIVERS.map(([d, w]) => `<path class="river" d="${d}" stroke-width="${w}"/>`).join("");
  map.innerHTML = water;                                  // сначала русла, чтобы их можно было измерить
  const paths = map.querySelectorAll("path.river");
  const pins = BRIDGES.filter(b => b[2]).map(([name, spans, p]) => {
    const path = paths[p.river];
    const { x, y } = path.getPointAtLength(p.at * path.getTotalLength());
    const dy = p.side === "above" ? -12 : 18;
    return `<circle class="pt ${bridgeState(spans, t)[0]}" cx="${x}" cy="${y}" r="5"/>
      <text class="lbl" x="${x}" y="${y + dy}">${p.short ?? name}</text>`;
  }).join("");
  const note = `<text class="note" x="12" y="228">Sampsonievsky, Grenadersky, Kantemirovsky — 01:30–04:30 on request, 2 days ahead</text>`;
  map.innerHTML = water + pins + note;
};

const paint = () => {
  const t = nowMsk();
  museums.innerHTML = MUSEUMS.map(([n, h]) => tile(n, placeState(h, t))).join("");
  shops.innerHTML = SHOPS.map(([n, h]) => tile(n, placeState(h, t))).join("");
  bakeries.innerHTML = BAKERIES.map(([n, h]) => tile(n, placeState(h, t))).join("");
  bridges.innerHTML = BRIDGES.map(([n, s]) => tile(n, bridgeState(s, t))).join("");
  drawMap(t);
};

/* ───────── Weather ───────── */

const PLACES = [["Kamenka", 60.045, 30.243], ["Petrogradka", 59.96, 30.31]];

const arrow = dir => `<svg viewBox="0 0 24 24" style="transform:rotate(${dir + 180}deg)" aria-hidden="true">
  <path d="M12 21V5M12 5l-5.4 5.4M12 5l5.4 5.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;

const weather = data => wx.innerHTML = PLACES.map(([name], i) => {
  const c = data?.[i]?.current;
  if (!c) return `<div class="tile wx idle"><b>${name}</b><span>no data</span></div>`;
  // red when cold (below +5), windy (7 m/s and up) or raining
  const bad = c.temperature_2m < 5 || c.wind_speed_10m >= 7 || c.weather_code >= 51;
  const sign = c.temperature_2m > 0 ? "+" : "";
  return `<div class="tile wx ${bad ? "shut" : "open"}">
    <b>${name}</b>
    <div class="val">${sign}${c.temperature_2m.toFixed(1)}°  ${arrow(c.wind_direction_10m)} ${Math.round(c.wind_speed_10m)} m/s</div>
  </div>`;
}).join("");

const loadWeather = () => fetch("https://api.open-meteo.com/v1/forecast?latitude=60.045,59.96&longitude=30.243,30.31" +
  "&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&wind_speed_unit=ms")
  .then(r => r.json()).then(weather).catch(() => weather(null));

/* ───────── Brent and news ───────── */

const brent = async () => {
  const ser = await (await fetch("https://iss.moex.com/iss/statistics/engines/futures/markets/forts/series.json?asset_code=BR&iss.meta=off")).json();
  const cols = ser.series.columns, today = new Date().toISOString().slice(0, 10);
  const live = ser.series.data.map(r => Object.fromEntries(r.map((v, i) => [cols[i], v])))
    .filter(r => r.is_traded && r.expiration_date >= today)
    .sort((a, b) => a.expiration_date < b.expiration_date ? -1 : 1)[0];
  const q = await (await fetch(`https://iss.moex.com/iss/engines/futures/markets/forts/securities/${live.secid}.json?iss.meta=off&iss.only=marketdata&marketdata.columns=LAST,SETTLEPRICE`)).json();
  const [last, settle] = q.marketdata.data[0] ?? [];
  document.getElementById("brent").textContent = `$${(last || settle).toFixed(2)}`;
};

const topNews = async () => {
  const from = new Date(Date.now() - 36e5 * 30).toISOString().slice(0, 10);
  const r = await (await fetch("https://content.guardianapis.com/search?section=us-news&order-by=newest" +
    `&from-date=${from}&page-size=20&api-key=test`)).json();
  const cut = Date.now() - 864e5;
  const top = r.response.results.find(a => +new Date(a.webPublicationDate) >= cut) ?? r.response.results[0];
  const el = document.getElementById("news");
  el.textContent = top.webTitle;
  el.href = top.webUrl;
};

paint();
loadWeather();
brent().catch(() => {});
topNews().catch(() => {});
setInterval(paint, 60000);
setInterval(loadWeather, 300000);
setInterval(() => { brent().catch(() => {}); topNews().catch(() => {}) }, 900000);
</script>
